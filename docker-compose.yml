
services:

  discovery-service:
    image: devwuu/discouvery-service
    restart: always
    hostname: discovery-service
    container_name: discovery-service
    ports:
      - 8761:8761
    networks:
      - app-net

  config-service:
    image: devwuu/config-service
    restart: always
    hostname: config-service
    container_name: config-service
    ports:
      - 8888:8888
    networks:
      - app-net

  gateway-service:
    image: devwuu/gateway-service
    restart: always
    hostname: gateway-service
    container_name: gateway-service
    ports:
      - 8000:8000
    depends_on:
      - config-service
      - discovery-service
    networks:
      - app-net

  user-service:
    image: devwuu/user-servicee
    restart: always
    hostname: user-service
    container_name: user-service
    depends_on:
      - config-service
      - discovery-service
    networks:
      - app-net

  order-service:
    image: devwuu/order-service
    restart: always
    hostname: order-service
    container_name: order-service
    depends_on:
      - config-service
      - discovery-service
    networks:
      - app-net

  catalog-service:
    image: devwuu/catalog-service
    restart: always
    hostname: catalog-service
    container_name: catalog-service
    depends_on:
      - config-service
      - discovery-service
    networks:
      - app-net

  user-service-db:
    image: mariadb
    restart: always
    hostname: user-service-db
    container_name: user-service-db
    networks:
      - app-net
    ports:
      - 3306:3306
    environment:
      MARIADB_ROOT_PASSWORD: qwerty
      MARIADB_DATABASE: user_sys
    volumes:
      - "./db/user:/var/lib/mysql"

  order-service-db:
    image: mariadb
    restart: always
    hostname: order-service-db
    container_name: order-service-db
    networks:
      - app-net
    ports:
      - 3307:3306
    environment:
      MARIADB_ROOT_PASSWORD: qwerty
      MARIADB_DATABASE: order_sys
    volumes:
      - "./db/order:/var/lib/mysql"

  catalog-service-db:
    image: mariadb
    restart: always
    hostname: catalog-service-db
    container_name: catalog-service-db
    networks:
      - app-net
    ports:
      - 3308:3306
    environment:
      MARIADB_ROOT_PASSWORD: qwerty
      MARIADB_DATABASE: catalog_sys
    volumes:
      - "./db/catalog:/var/lib/mysql"

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    hostname: rabbitmq
    container_name: rabbitmq
    networks:
      - app-net
    volumes:
      - "./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_ERLANG_COOKIE: myrabbitmq
    ports:
      - 15672:15672
      - 5672:5672

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: always
    container_name: zookeeper
    hostname: zookeeper
    networks:
      - app-net
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1

  broker-1:
    image: confluentinc/cp-kafka:latest
    platform: linux/arm64/v8
    restart: always
    hostname: broker-1
    container_name: broker-1
    networks:
      - app-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100

  connector:
    image: confluentinc/cp-kafka-connect:latest
    restart: always
    platform: linux/arm64/v8
    hostname: connector
    container_name: connector
    ports:
      - 8083:8083
    networks:
      - app-net
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker-1:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/data/connect-jars
    volumes:
      - ./confluent/connect/connector/confluentinc-kafka-connect-jdbc/lib:/usr/share/confluent-hub-components
      - ./confluent/connect/mysql:/etc/kafka-connect/jars

  zipkin:
    image: openzipkin/zipkin
    restart: always
    container_name: zipkin
    hostname: zipkin
    networks:
      - app-net
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus
    restart: always
    container_name: prometheus
    hostname: prometheus
    networks:
      - app-net
    command:
      - '--storage.tsdb.path=/prometheus'
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "./prometheus/data:/prometheus "

  grafana:
    image: grafana/grafana
    restart: always
    container_name: grafana
    hostname: grafana
    networks:
      - app-net
    ports:
      - "3000:3000"
    volumes:
      - './grafana:/var/lib/grafana'

networks:
  app-net:
    driver: bridge