
server:
  port: 0

spring:
  application:
    name: order-service

  cloud:
    config:
      uri: http://localhost:8888
      name: order-service

  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  tracing:
    sampling:
      probability: 1.0 # 모든 로그 샘플링
    propagation:
      consume: w3c
      produce: w3c
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, busrefresh, info, metrics, prometheus
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
